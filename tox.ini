[tox]
envlist =
    py312-test{,-alldeps,-devdeps}{,-cov}
    py312-test-numpy{116,117,118}
    py312-test-astropy{30,40,lts}
    build_docs
    build_docs_rtd
    linkcheck
    codestyle
requires =
    setuptools >= 30.3.0
    pip >= 24.0
    virtualenv >= 20.26.0
isolated_build = true
indexserver =
    NIGHTLY = https://pypi.anaconda.org/scipy-wheels-nightly/simple

[testenv]
# Suppress display of matplotlib plots generated during docs build
setenv =
    MPLBACKEND=agg
    test: PYSYN_CDBS={toxinidir}/.tox/_synphot_cdbs

# Pass through the following environment variables which may be needed for the CI
passenv =
    HOME
    WINDIR
    LC_ALL
    LC_CTYPE
    CC
    CI
    TRAVIS

# Run the tests in a temporary directory to make sure that we don't import
# this package from the source tree
changedir = .tmp/{envname}

# tox environments are constructed with so-called 'factors' (or terms)
# separated by hyphens, e.g. test-devdeps-cov. Lines below starting with factor:
# will only take effect if that factor is included in the environment name. To
# see a list of example environments that can be run, along with a description,
# run:
#
#     tox -l -v
#
description =
    run tests
    alldeps: with all optional dependencies
    devdeps: with the latest developer version of key dependencies
    oldestdeps: with the oldest supported version of key dependencies
    cov: and test coverage
    numpy116: with numpy 1.16.*
    numpy117: with numpy 1.17.*
    numpy118: with numpy 1.18.*
    astropy30: with astropy 3.0.*
    astropy40: with astropy 4.0.*
    astropylts: with the latest astropy LTS

# The following provides some specific pinnings for key packages
deps =

    cov: coverage
    numpy116: numpy==1.16.*
    numpy117: numpy==1.17.*
    numpy118: numpy==1.18.*

    astropy30: astropy==3.0.*
    astropy40: astropy==4.0.*
    astropylts: astropy==4.0.*

    devdeps: :NIGHTLY:numpy
    devdeps: git+https://github.com/astropy/astropy.git#egg=astropy

# The following indicates which extras_require from setup.cfg will be installed
extras =
    test
    alldeps: all

commands_pre =
    test: python -c "import os, urllib.request; root=os.environ['PYSYN_CDBS']; os.makedirs(root, exist_ok=True); base='https://archive.stsci.edu/hlsps/reference-atlases/cdbs'; files=[('grid/phoenix/catalog.fits', base + '/grid/phoenix/catalog.fits'), ('grid/phoenix/phoenixm00/phoenixm00_2000.fits', base + '/grid/phoenix/phoenixm00/phoenixm00_2000.fits'), ('grid/phoenix/phoenixm00/phoenixm00_3000.fits', base + '/grid/phoenix/phoenixm00/phoenixm00_3000.fits'), ('grid/k93models/catalog.fits', base + '/grid/k93models/catalog.fits'), ('grid/k93models/kp00/kp00_4000.fits', base + '/grid/k93models/kp00/kp00_4000.fits'), ('grid/k93models/kp00/kp00_5000.fits', base + '/grid/k93models/kp00/kp00_5000.fits')]; [os.path.exists(os.path.join(root, relpath)) or (os.makedirs(os.path.dirname(os.path.join(root, relpath)), exist_ok=True) or urllib.request.urlretrieve(url, os.path.join(root, relpath))) for relpath, url in files]"

commands =
    pip freeze
    !cov: pytest --pyargs icemodels {posargs}
    cov: pytest --pyargs icemodels --cov icemodels --cov-config={toxinidir}/setup.cfg {posargs}
    cov: coverage xml -o {toxinidir}/coverage.xml

[testenv:build_docs]
basepython = /blue/adamginsburg/adamginsburg/miniconda3/envs/python313/bin/python
changedir = docs
description = invoke sphinx-build to build the HTML docs
extras = docs
commands =
    pip freeze
    sphinx-build -W -b html . _build/html

[testenv:build_docs_rtd]
basepython = /blue/adamginsburg/adamginsburg/miniconda3/envs/python313/bin/python
changedir = docs
description = run the ReadTheDocs-style sphinx command locally
deps =
    -r{toxinidir}/docs/requirements.txt
setenv =
    {[testenv]setenv}
    READTHEDOCS = true
    READTHEDOCS_OUTPUT = _build
commands =
    pip freeze
    python -m sphinx -T -W --keep-going -b html -d _build/doctrees -D language=en . {env:READTHEDOCS_OUTPUT}/html

[testenv:linkcheck]
changedir = docs
description = check the links in the HTML docs
extras = docs
commands =
    pip freeze
    sphinx-build -W -b linkcheck . _build/html

[testenv:codestyle]
skip_install = true
changedir = .
description = check code style, e.g. with flake8
deps = flake8
commands = flake8 icemodels --count --max-line-length=100
