name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  notebook-health:
    runs-on: ubuntu-latest
    env:
      ICEMODELS_DOCS_PREPARE_SYNPHOT: "1"
      ICEMODELS_DOCS_PREPARE_OCDB: "1"
      PYSYN_CDBS: ${{ github.workspace }}/_synphot_cdbs
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install notebook execution dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs,all]"
        pip install nbclient nbformat ipykernel

    - name: Provision minimal synphot CDBS reference data
      run: |
        python - <<'PY'
        import os
        import urllib.request
        root = os.environ['PYSYN_CDBS']
        base = 'https://archive.stsci.edu/hlsps/reference-atlases/cdbs'
        files = [
            ('grid/phoenix/catalog.fits', f'{base}/grid/phoenix/catalog.fits'),
            ('grid/phoenix/phoenixm00/phoenixm00_2000.fits',
             f'{base}/grid/phoenix/phoenixm00/phoenixm00_2000.fits'),
            ('grid/phoenix/phoenixm00/phoenixm00_3000.fits',
             f'{base}/grid/phoenix/phoenixm00/phoenixm00_3000.fits'),
            ('grid/phoenix/phoenixm00/phoenixm00_4000.fits',
             f'{base}/grid/phoenix/phoenixm00/phoenixm00_4000.fits'),
            ('grid/phoenix/phoenixm00/phoenixm00_5000.fits',
             f'{base}/grid/phoenix/phoenixm00/phoenixm00_5000.fits'),
            ('grid/k93models/catalog.fits', f'{base}/grid/k93models/catalog.fits'),
            ('grid/k93models/kp00/kp00_4000.fits',
             f'{base}/grid/k93models/kp00/kp00_4000.fits'),
            ('grid/k93models/kp00/kp00_5000.fits',
             f'{base}/grid/k93models/kp00/kp00_5000.fits'),
        ]
        for relpath, url in files:
            dest = os.path.join(root, relpath)
            os.makedirs(os.path.dirname(dest), exist_ok=True)
            if not os.path.exists(dest):
                urllib.request.urlretrieve(url, dest)
        PY

    - name: Execute notebooks and flag slow cells
      run: |
        python docs/check_notebook_execution_times.py \
          --notebook-dir notebooks \
          --threshold-seconds 30 \
          --timeout-seconds 1800 \
          --exclude ISO_Spectra.ipynb \
          --exclude SpectraFromPhoto.ipynb \
          --report-file docs/notebook_timing_report.json

    - name: Append notebook timing report to job summary
      run: |
        python - <<'PY'
        import json
        from pathlib import Path

        report = json.loads(Path('docs/notebook_timing_report.json').read_text())
        lines = []
        lines.append('## Notebook Execution Timing')
        lines.append('')
        lines.append(f"Threshold: {report['threshold_seconds']} seconds")
        lines.append(f"Notebooks executed: {len(report['results'])}")
        lines.append(f"Slow cells: {len(report['slow_cells'])}")
        failed = report.get('failed_notebooks', [])
        lines.append(f"Notebooks with errors: {len(failed)}")
        excluded = report.get('excluded', [])
        if excluded:
            lines.append(f"Excluded notebooks: {', '.join(excluded)}")
        lines.append('')

        if failed:
            lines.append('### Notebooks with Errors')
            lines.append('')
            for entry in failed:
                lines.append(f"- {entry['notebook']}: `{entry['error']}`")
            lines.append('')

        if report['slow_cells']:
            lines.append('### Slow Cells')
            lines.append('')
            for cell in report['slow_cells']:
                preview = cell['source_preview'][0] if cell['source_preview'] else ''
                lines.append(
                    f"- {cell['flag'].upper()}: {cell['notebook']} cell {cell['cell_number']} "
                    f"({cell['duration_seconds']:.2f}s) `{preview}`"
                )
        else:
            lines.append('No slow cells were detected.')

        summary = Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])
        summary.write_text('\n'.join(lines), encoding='utf-8')
        PY

    - name: Upload notebook timing report
      uses: actions/upload-artifact@v4
      with:
        name: notebook-timing-report
        path: docs/notebook_timing_report.json

  build-docs:
    needs: notebook-health
    runs-on: ubuntu-latest
    env:
      ICEMODELS_DOCS_PREPARE_SYNPHOT: "1"
      ICEMODELS_DOCS_PREPARE_OCDB: "1"
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs,all]"
        pip install sphinx sphinx-rtd-theme

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Check for build errors
      run: |
        if [ -d "docs/_build/html" ]; then
          echo "Documentation built successfully"
        else
          echo "Documentation build failed"
          exit 1
        fi

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build/html

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4